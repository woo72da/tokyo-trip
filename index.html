    <div class="intro-text"><b>도쿄 여행</b><span id="intro-line"></span></div>
    <script>
      (function () {
        var el = document.getElementById('intro');
        var close = function () { if (el.parentNode) el.remove(); };
        try {
          var today = new Date().toDateString();
          if (matchMedia('(prefers-reduced-motion: reduce)').matches || localStorage.getItem('introDay') === today) return close();
          localStorage.setItem('introDay', today);
        } catch (e) { return close(); }
        el.hidden = false;
        el.addEventListener('click', close);
        setTimeout(close, 1900);
      })();
    </script>
